name: Create Release

on:
  push:
    tags:
      - "*.*.*" # Triggers on tags like 1.0.0 and v1.0.0

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Build app
        id: build
        uses: ./.github/actions/build-app

      - name: Validate embedded runtime assets
        working-directory: ./src
        shell: bash
        run: go test . -run '^TestEmbeddedAstilectronArchive$' -count=1

      - name: Package artifacts
        id: package
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $tag (expected 1.2.3 or v1.2.3)" >&2
            exit 1
          fi

          release_version="v${version}"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"

          mkdir -p release_packages

          for platform in windows-amd64 linux-amd64 darwin-amd64; do
            output_dir="src/output/${platform}"
            if [[ ! -d "$output_dir" ]] || [[ -z "$(find "$output_dir" -mindepth 1 -print -quit)" ]]; then
              echo "Build output is missing or empty: $output_dir" >&2
              exit 1
            fi
          done

          # Package Windows artifact as a zip
          (
            cd src/output/windows-amd64
            zip -r "../../../release_packages/switch-library-manager-${release_version}.windows-amd64.zip" .
          )

          # Package Linux artifact as a tar.gz
          (
            cd src/output/linux-amd64
            tar -czf "../../../release_packages/switch-library-manager-${release_version}.linux-amd64.tar.gz" .
          )

          # Package Mac artifact as a zip
          (
            cd src/output/darwin-amd64
            zip -r "../../../release_packages/switch-library-manager-${release_version}.darwin-amd64.zip" .
          )

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release_packages/switch-library-manager-${{ steps.package.outputs.release_version }}.windows-amd64.zip
            release_packages/switch-library-manager-${{ steps.package.outputs.release_version }}.linux-amd64.tar.gz
            release_packages/switch-library-manager-${{ steps.package.outputs.release_version }}.darwin-amd64.zip
