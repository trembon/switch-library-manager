name: Create Release

on:
  push:
    tags:
      - "*.*.*" # Triggers on tags like 1.0.0 and v1.0.0

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: switch-library-manager.windows-amd64
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: switch-library-manager.linux-amd64
          - os: macos-15-intel
            platform: darwin/amd64
            artifact: switch-library-manager.darwin-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Build app
        uses: ./.github/actions/build-app
        with:
          platform: ${{ matrix.platform }}

      - name: Publish artifact
        uses: ./.github/actions/publish-artifacts
        with:
          artifact-name: ${{ matrix.artifact }}

  package-and-release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: switch-library-manager.windows-amd64
          path: release_inputs/windows-amd64

      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: switch-library-manager.linux-amd64
          path: release_inputs/linux-amd64

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: switch-library-manager.darwin-amd64
          path: release_inputs/darwin-amd64

      - name: Package artifacts
        id: package
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $tag (expected 1.2.3 or v1.2.3)" >&2
            exit 1
          fi

          release_version="v${version}"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"

          package_dir="$GITHUB_WORKSPACE/release_packages"
          mkdir -p "$package_dir"

          for platform in windows-amd64 linux-amd64 darwin-amd64; do
            artifact_dir="release_inputs/${platform}"
            if [[ ! -d "$artifact_dir" ]] || [[ -z "$(find "$artifact_dir" -mindepth 1 -print -quit)" ]]; then
              echo "Downloaded artifact is missing or empty: $artifact_dir" >&2
              exit 1
            fi
          done

          (
            cd release_inputs/windows-amd64
            zip -r "$package_dir/switch-library-manager-${release_version}.windows-amd64.zip" .
          )

          tar -czf "$package_dir/switch-library-manager-${release_version}.linux-amd64.tar.gz" \
            -C release_inputs/linux-amd64 .

          (
            cd release_inputs/darwin-amd64
            zip -r "$package_dir/switch-library-manager-${release_version}.darwin-amd64.zip" .
          )

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release_packages/switch-library-manager-${{ steps.package.outputs.release_version }}.windows-amd64.zip
            release_packages/switch-library-manager-${{ steps.package.outputs.release_version }}.linux-amd64.tar.gz
            release_packages/switch-library-manager-${{ steps.package.outputs.release_version }}.darwin-amd64.zip
